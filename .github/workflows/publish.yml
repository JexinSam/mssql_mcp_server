name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  # Run the full unit + integration suite against the released ref.
  # Publishing is blocked unless this passes.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Verify release tag matches package version
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        TAG="${TAG_NAME#v}"
        PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "release tag: $TAG"
        echo "pyproject:   $PKG"
        if [ "$TAG" != "$PKG" ]; then
          echo "::error::Release tag ($TAG) does not match pyproject.toml version ($PKG)"
          exit 1
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
